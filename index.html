<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SpaceX Launchpads</title>
    <link rel="stylesheet" href="styles/app.css">
</head>
<body>
    <div class="main">
        <aside class="aside">
            <button id="refreshBtn">Refresh data</button>
            <div id="listContainer"></div>
        </aside>

        <div class="content">
            <div id="padInfo" class="pad-info">Hover a launch to see pad details</div>

            <div class="map-wrap">
                <div id="map"></div>
                <div class="map-controls">
                    <button id="zoomIn"    title="Zoom in"    aria-label="Zoom in">+</button>
                    <button id="zoomOut"   title="Zoom out"   aria-label="Zoom out">−</button>
                    <button id="zoomReset" title="Reset zoom" aria-label="Reset zoom">⟲</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="src/index.js"></script>
</body>
</html>
